# Third-party licences (cargo-about, #52): `packaging/third-party-licences.sh` writes THIRD-PARTY-LICENSES.md.
# Licences compatible with GPL-3.0-or-later; for "A OR B" crates the first one listed here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
