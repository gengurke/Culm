[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/testkit"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Rune is pre-release: pinned to one commit of the dev branch (fast-forward only, never rewritten).
# Bump deliberately: same rev everywhere, and re-sync [patch.crates-io] from Rune's root Cargo.toml.
# Rune's defaults minus `embedded-fonts`: the app brings its own Inter (`theme::FONTS`).
rune     = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d", default-features = false, features = ["accessibility", "dbus", "metal-backend", "ogg-audio", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Cargo does not inherit [patch] from dependencies: mirror Rune's root [patch.crates-io] at the SAME rev.
[patch.crates-io]
winit             = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d" }
parley_engine     = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d" }
wgpu-hal          = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d" }
sctk-adwaita      = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d" }
accesskit_macos   = { git = "https://github.com/anomalyco/rune", rev = "8fbc395190dbff430db9d9fc515bb6ac8cc7d13d" }

# Rune's recommendation: full debuginfo makes test builds use huge amounts of RAM.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true

# Fingerprinting/zip in debug builds is ~6x slower than release; keep the core snappy in dev.
[profile.dev.package.addon-core]
opt-level = 1
