# Dependency audit (cargo-deny, F8.2): security advisories, licences that fit GPL-3.0-or-later, crate sources.
# Run locally: `cargo deny check`.

[graph]
all-features = true

[licenses]
# Licences compatible with GPL-3.0-or-later. CDLA-Permissive-2.0: the root-certificate list in webpki-roots.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Rune is pinned to a commit of its dev branch (AGENTS.md).
allow-git = ["https://github.com/anomalyco/rune"]
