[package]
name = "addon-core"
description = "UI-free core of the addon manager: WoW installs, TOC, fingerprints, providers, install/update."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# Validates the downloaded class icons (already built for Rune: no new crates).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = "3"
# Checks a downloaded app update against the release's SHA256SUMS.
sha2 = "0.10"
# Recognises a zip fetched by hand from the SHA-1 its source publishes (F3.5).
sha1 = "0.10"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# Lists running programs on Windows and macOS for the game check (Linux reads /proc itself).
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
addon-testkit = { path = "../testkit" }
tempfile = "3.27.0"
