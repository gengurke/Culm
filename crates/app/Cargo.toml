[package]
name = "addon-app"
description = "Rune desktop UI of the addon manager."
version.workspace = true
edition.workspace = true
license.workspace = true

# The product name is not final: change it here and in src/brand.rs only.
[lib]
path = "src/lib.rs"

[[bin]]
name = "culm"
path = "src/main.rs"

[dependencies]
addon-core = { path = "../core" }
# native-file-dialog: folder picker for "Add installation" (XDG portal on Linux).
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"

# Restarting into an updated AppImage closes inherited descriptors (see `CoreBackend::launch_app`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Icon and version info in culm.exe (build.rs); only used when building for Windows.
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
addon-testkit = { path = "../testkit" }
serde_json.workspace = true
tempfile = "3.27.0"
# Reads the bundled fonts' family names (already in the tree through Rune).
swash = "0.2"
# Publishes a test zip's SHA-1 the way CurseForge does (F3.5).
sha1 = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
